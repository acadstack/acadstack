download_filtered_categorized_credits_enrolled = """
WITH base_credits AS (
    SELECT 
        SUM(c.credits) AS total_credits,
        COALESCE(NULLIF(TRIM(cc.category), ''), 'UnCat') AS c_category,
        u.email,
        u.id,
        u.first_name,
        u.last_name,
        u.login_id,
        co.acad_session,
        p.dept_name
    FROM public.courseenrollment ce
    JOIN public.user u ON u.id = ce.student_id
    JOIN public.person p ON p.id = u.person_id
    JOIN public.courseoffering co ON co.id = ce.course_offering_id
    JOIN public.course c ON c.id = co.course_id
    LEFT JOIN public.coursecategory cc 
      ON cc.offering_id = ce.course_offering_id
      AND cc.degree = p.degree
      AND (cc.dept = p.dept_name OR cc.dept = 'ALL')
      AND (cc.for_entry_years ~ %s)
    WHERE ce.enrol_status = 'ENRO'
      AND ce.enrol_type IN ('C', 'CC', 'CM')
      AND (p.year_of_entry = %s OR %s = '')
      AND (p.degree = %s OR %s = '')
      AND (p.dept_name = %s OR %s = '')
      AND (co.acad_session = %s OR %s = '')
      AND ce.grade IN ('A','A-','B','B-','C','C-','D','S','NP')
    GROUP BY 
        cc.category, u.email, u.id, u.first_name, 
        u.last_name, u.login_id, co.acad_session, p.dept_name
),
filtered AS (
    SELECT *
    FROM base_credits
    WHERE (%s = '' OR c_category = %s)
      AND total_credits BETWEEN %s AND %s
),
category_totals AS (
    SELECT 
        c_category,
        SUM(total_credits) AS cat_total,
        first_name,
        last_name,
        login_id,
        email,
        id AS user_id,
        dept_name
    FROM filtered
    GROUP BY 
        c_category, login_id, first_name, last_name, email, id, dept_name
)
SELECT 
    STRING_AGG(CONCAT_WS('=', c.c_category, ROUND(c.cat_total, 2)), ' | ') AS cat_credits,
    SUM(c.cat_total) AS Earned_Credit_Total,
    c.first_name,
    c.last_name,
    c.login_id,
    c.email,
    c.dept_name
FROM category_totals c
GROUP BY 
    c.first_name, c.last_name, c.login_id, c.email, c.dept_name
ORDER BY 
    c.login_id;
"""

credits_enrolled_by_student = """
