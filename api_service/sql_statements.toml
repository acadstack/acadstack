daywise_attendance = """
    WITH enrolment_count(total, co_id) AS (
    SELECT count(*) total, ce.course_offering_id 
    FROM public.courseenrollment ce
    WHERE ce.enrol_status='ENRO' GROUP BY ce.course_offering_id)

    SELECT COUNT(*) present, f.total, sa.attend_dt, co.acad_session,
    c.title, c.code
    FROM public.studentattendance sa
    JOIN public.courseenrollment ce ON ce.id=sa.enrollment_id
    JOIN public.courseoffering co ON co.id=ce.course_offering_id
    JOIN public.course c ON c.id=co.course_id
    JOIN enrolment_count f on f.co_id=co.id
    WHERE co.id=%s AND sa.attend='P'
    GROUP BY sa.attend_dt, co.id, c.id;"""